<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Panel de Administrador</ion-title>
  </ion-toolbar>
  <ion-toolbar color="dark">
    <ion-searchbar placeholder="Buscar por nombre, RUT o email..." (ionInput)="filterUsers($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding admin-content">
  <div *ngIf="loading" class="loading-container">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando usuarios...</p>
  </div>

  <div *ngIf="!loading">
    <div class="stats-row">
      <div class="stat-box">
        <h4>{{ usuarios.length }}</h4>
        <p>Usuarios Totales</p>
      </div>
      <div class="stat-box">
        <h4>{{ getActivosCount() }}</h4>
        <p>Activos</p>
      </div>
    </div>

    <ion-list class="user-list" lines="full">
      <ion-item *ngFor="let user of usuariosFiltrados" class="user-item" [class.inactive]="!user.activo">
        <ion-avatar slot="start" class="admin-avatar" [class.is-admin]="user.es_admin">
          <ion-icon name="person"></ion-icon>
        </ion-avatar>
        
        <ion-label>
          <h2>{{ user.nombre_completo }} <ion-badge color="warning" *ngIf="user.es_admin">ADMIN</ion-badge></h2>
          <p>{{ user.email }} | RUT: {{ user.rut }}</p>
          <p>XP: {{ user.xp_total }} | Racha: {{ user.racha_actual }}</p>
        </ion-label>

        <ion-buttons slot="end" class="action-buttons">
          <ion-button (click)="toggleStatus(user)" [color]="user.activo ? 'medium' : 'success'">
            <ion-icon [name]="user.activo ? 'lock-closed' : 'lock-open'" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button color="danger" (click)="confirmDelete(user)">
            <ion-icon name="trash" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-list>
    
    <div *ngIf="usuariosFiltrados.length === 0" class="no-results">
      <p>No se encontraron usuarios.</p>
    </div>
  </div>
</ion-content>
