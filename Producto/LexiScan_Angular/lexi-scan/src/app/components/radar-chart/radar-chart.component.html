<div class="radar-container">
  <svg viewBox="0 0 200 210" class="radar-chart">
    <!-- 1. Hexágonos de fondo (Niveles de profundidad) -->
    <polygon
      points="100,80 118,90 118,110 100,120 82,110 82,90"
      fill="none"
      stroke="rgba(255,255,255,0.5)"
      stroke-width="1"
    />
    <polygon
      points="100,60 136,80 136,120 100,140 64,120 64,80"
      fill="none"
      stroke="rgba(255,255,255,0.5)"
      stroke-width="1"
    />
    <polygon
      points="100,40 155,70 155,130 100,160 45,130 45,70"
      fill="rgba(255,255,255,0.05)"
      stroke="#666"
      stroke-width="1"
    />

    <!-- 2. Líneas de los ejes -->
    <g stroke="#555" stroke-width="1">
      <line x1="100" y1="100" x2="100" y2="40" />
      <line x1="100" y1="100" x2="155" y2="70" />
      <line x1="100" y1="100" x2="155" y2="130" />
      <line x1="100" y1="100" x2="100" y2="160" />
      <line x1="100" y1="100" x2="45" y2="130" />
      <line x1="100" y1="100" x2="45" y2="70" />
    </g>

    <!-- 3. Regiones de color dinámicas -->
    <path
      *ngFor="let reg of regiones; let i = index"
      [attr.d]="getRegionPath(i)"
      [attr.fill]="reg.color"
    />

    <!-- 4. Círculos blancos en los vértices de progreso -->
    <circle
      *ngFor="let p of getRadarPointsArray()"
      [attr.cx]="p.x"
      [attr.cy]="p.y"
      r="2.5"
      fill="white"
    />

    <!-- 5. Círculos blancos fijos (Vértices y Centro) -->
    <circle cx="100" cy="100" r="3" fill="white" />
    <g fill="white" opacity="0.6">
      <circle cx="100" cy="40" r="2" />
      <circle cx="155" cy="70" r="2" />
      <circle cx="155" cy="130" r="2" />
      <circle cx="100" cy="160" r="2" />
      <circle cx="45" cy="130" r="2" />
      <circle cx="45" cy="70" r="2" />
    </g>

    <!-- 6. Etiquetas con saltos de línea -->
    <text x="100" y="30" text-anchor="middle" class="radar-label">
      Interpretar
    </text>
    <text x="160" y="70" text-anchor="start" class="radar-label">
      Vocabulario
    </text>
    <text x="160" y="130" text-anchor="start" class="radar-label">
      <tspan x="160" dy="0">Tipos de</tspan>
      <tspan x="160" dy="12">Texto</tspan>
    </text>
    <text x="100" y="175" text-anchor="middle" class="radar-label">
      Localizar
    </text>
    <text x="40" y="130" text-anchor="end" class="radar-label">
      <tspan x="40" dy="0">Lectura</tspan>
      <tspan x="40" dy="12">Crítica</tspan>
    </text>
    <text x="40" y="70" text-anchor="end" class="radar-label">Evaluar</text>
  </svg>
</div>
