<div class="radar-container" (mouseenter)="playAnimation()">
  <svg viewBox="0 0 250 210" class="radar-chart">
    <!-- 1. Hexágonos de fondo (Niveles de profundidad) -->
    <polygon
      points="125,80 143,90 143,110 125,120 107,110 107,90"
      fill="none"
      stroke="#cbd5e1"
      stroke-width="1"
    />
    <polygon
      points="125,60 161,80 161,120 125,140 89,120 89,80"
      fill="none"
      stroke="#cbd5e1"
      stroke-width="1"
    />
    <polygon
      points="125,40 180,70 180,130 125,160 70,130 70,70"
      fill="#f1f5f9"
      stroke="#94a3b8"
      stroke-width="1"
    />

    <!-- 2. Líneas de los ejes -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="125" y1="100" x2="125" y2="40" />
      <line x1="125" y1="100" x2="180" y2="70" />
      <line x1="125" y1="100" x2="180" y2="130" />
      <line x1="125" y1="100" x2="125" y2="160" />
      <line x1="125" y1="100" x2="70" y2="130" />
      <line x1="125" y1="100" x2="70" y2="70" />
    </g>

    <!-- 3. Ghost regions (Estado anterior delineado) -->
    <ng-container *ngIf="oldHabilidades && oldHabilidades.length > 0">
      <polygon
        [attr.points]="getOldRadarPolygon()"
        fill="none"
        stroke="#64748b"
        stroke-width="2"
        stroke-dasharray="4,4"
      />
      <circle
        *ngFor="let p of getOldRadarPointsArray()"
        [attr.cx]="p.x"
        [attr.cy]="p.y"
        r="4"
        fill="#ffffff"
        stroke="#64748b"
        stroke-width="1.5"
      />
    </ng-container>

    <!-- 4. Regiones de color dinámicas -->
    <path
      *ngFor="let reg of regiones; let i = index"
      [attr.d]="getRegionPath(i)"
      [attr.fill]="reg.color"
      class="animated-path"
    />

    <!-- 5. Círculos de progreso (morados) -->
    <circle
      *ngFor="let p of getRadarPointsArray()"
      [attr.cx]="p.x"
      [attr.cy]="p.y"
      r="3.5"
      fill="#6366f1"
      stroke="white"
      stroke-width="1.5"
      class="animated-circle"
    />

    <!-- 5. Círculos blancos fijos -->
    <circle cx="125" cy="100" r="3" fill="white" />

    <!-- 6. Etiquetas (Ajustadas con más espacio lateral) -->
    <text x="125" y="30" text-anchor="middle" class="radar-label">
      Interpretar
    </text>

    <text x="185" y="70" text-anchor="start" class="radar-label">
      Vocabulario
    </text>

    <text x="185" y="130" text-anchor="start" class="radar-label">
      <tspan x="185" dy="0">Tipos de</tspan>
      <tspan x="185" dy="12">Texto</tspan>
    </text>

    <text x="125" y="175" text-anchor="middle" class="radar-label">
      Localizar
    </text>

    <text x="65" y="130" text-anchor="end" class="radar-label">
      <tspan x="65" dy="0">Lectura</tspan>
      <tspan x="65" dy="12">Crítica</tspan>
    </text>

    <text x="65" y="70" text-anchor="end" class="radar-label">Evaluar</text>
  </svg>
</div>
