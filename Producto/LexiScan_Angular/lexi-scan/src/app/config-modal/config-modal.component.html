<ion-header>
  <ion-toolbar>
    <ion-title>Configuración de API</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="config-modal-container">
    <form [formGroup]="configForm" (ngSubmit)="onSubmit()" class="config-form">

      <!-- API Key Input -->
      <div class="input-group">
        <label class="input-label">API Key de Groq</label>
        <div class="input-block">
          <ion-icon name="key-outline" class="input-icon"></ion-icon>
          <input formControlName="apiKey" placeholder="Ingresa tu API Key de Groq"
            [type]="showPassword ? 'text' : 'password'" class="native-input" />
          <ion-button fill="clear" slot="end" class="toggle-password-btn" (click)="togglePasswordVisibility()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>
        <p class="input-error-msg" *ngIf="configForm.get('apiKey')?.invalid && configForm.get('apiKey')?.touched">
          La API Key es requerida
        </p>
      </div>

      <div class="save-key-row">
        <button
          class="save-key-btn"
          type="button"
          [disabled]="configForm.get('apiKey')?.invalid || savingKey"
          (click)="saveApiKeyOnly()"
        >
          <ion-spinner *ngIf="savingKey" name="crescent" color="light" style="width: 16px; height: 16px; margin-right: 6px;"></ion-spinner>
          <span>Guardar y cargar modelos</span>
        </button>
      </div>

      <!-- Model Selection -->
      <div class="input-group">
        <label class="input-label">Modelo</label>
        <div class="input-block">
          <ion-icon name="cog-outline" class="input-icon"></ion-icon>
          <select formControlName="model" class="native-select">
            <option value="" disabled>Selecciona un modelo</option>
            <option *ngFor="let model of availableModels" [value]="model">{{ model }}</option>
          </select>
        </div>
      </div>

      <!-- Buttons -->
      <button class="btn-chunky-3d btn-chunky-3d-indigo btn-full" type="submit"
        [disabled]="configForm.invalid || loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        Guardar Configuración
      </button>

      <button class="btn-chunky-3d btn-chunky-3d-gray btn-full" type="button" (click)="closeModal()">
        Cancelar
      </button>
    </form>
  </div>
</ion-content>
