<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Resultados del Examen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="results-container" *ngIf="examResult">
    <!-- Score Summary -->
    <div class="score-card">
      <h2>Resultado del Simulacro</h2>
      <div class="score-display">
        <div class="score-number">
          {{ examResult.total_correctas }}/{{ examResult.total_preguntas }}
        </div>
        <div class="score-percentage">{{ examResult.porcentaje }}%</div>
      </div>
    </div>

    <!-- Radar Chart -->
    <div class="chart-card">
      <h3>Rendimiento por Habilidades</h3>
      <div class="radar-container">
        <svg viewBox="0 0 200 210" class="radar-chart">
          <line x1="100" y1="100" x2="100" y2="40" stroke="#cbd5e1" stroke-width="1"/>
          <line x1="100" y1="100" x2="155" y2="70" stroke="#cbd5e1" stroke-width="1"/>
          <line x1="100" y1="100" x2="155" y2="130" stroke="#cbd5e1" stroke-width="1"/>
          <line x1="100" y1="100" x2="100" y2="160" stroke="#cbd5e1" stroke-width="1"/>
          <line x1="100" y1="100" x2="45" y2="130" stroke="#cbd5e1" stroke-width="1"/>
          <line x1="100" y1="100" x2="45" y2="70" stroke="#cbd5e1" stroke-width="1"/>

          <polygon
            points="100,40 155,70 155,130 100,160 45,130 45,70"
            fill="#f1f5f9"
            stroke="#cbd5e1"
            stroke-width="1"
          />

          <polygon
            [attr.points]="getRadarPoints()"
            fill="rgba(99, 102, 241, 0.25)"
            stroke="#6366f1"
            stroke-width="3"
          />

          <text x="100" y="30" text-anchor="middle" class="radar-label">Interpretar</text>
          <text x="160" y="70" text-anchor="start" class="radar-label">Vocabulario</text>
          <text x="160" y="130" text-anchor="start" class="radar-label">
            <tspan x="160" dy="0">Tipos de</tspan>
            <tspan x="160" dy="12">Texto</tspan>
          </text>
          <text x="100" y="175" text-anchor="middle" class="radar-label">Localizar</text>
          <text x="40" y="130" text-anchor="end" class="radar-label">
            <tspan x="40" dy="0">Lectura</tspan>
            <tspan x="40" dy="12">Crítica</tspan>
          </text>
          <text x="40" y="70" text-anchor="end" class="radar-label">Evaluar</text>
        </svg>
      </div>

      <!-- Habilidades Breakdown -->
      <div class="habilidades-breakdown">
        <ion-item
          *ngFor="let hab of examResult.rendimiento_habilidades"
          lines="none"
        >
          <ion-label>{{ hab.nombre_habilidad }}</ion-label>
          <ion-badge slot="end"
            >{{ hab.correctas }}/{{ hab.total }} ({{ hab.porcentaje
            }}%)</ion-badge
          >
        </ion-item>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button
        class="btn-chunky-3d btn-chunky-3d-sky"
        (click)="saveResults()"
        [disabled]="loading"
      >
        Guardar Resultados
      </button>

      <button
        class="btn-chunky-3d btn-chunky-3d-indigo"
        (click)="downloadResultsPDF()"
        id="btn-download-results-pdf"
      >
        Descargar Examen y Resultados (PDF)
      </button>

      <button class="btn-chunky-3d btn-chunky-3d-gray" (click)="discardExam()">
        Descartar Examen
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Guardando resultados...</p>
  </div>
</ion-content>
