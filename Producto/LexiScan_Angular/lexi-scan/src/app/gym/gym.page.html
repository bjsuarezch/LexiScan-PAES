<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>GYM - Revancha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="gym-container">
    <!-- Error Frecuente Section - Only shown if error exists -->
    <ion-card class="error-card" *ngIf="errorFrecuente">
      <ion-card-content>
        <div class="error-header">
          <ion-icon name="flame"></ion-icon>
          <span>Error frecuente:</span>
        </div>
        <p class="error-title">{{ errorFrecuente.nombre_habilidad }}</p>
        
        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" [style.width]="(errorFrecuente.veces_fallada * 10) + '%'"></div>
          </div>
          <span class="progress-text">{{ errorFrecuente.veces_fallada }} veces fallada</span>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Radar Chart Section -->
    <ion-card class="chart-card">
    <ion-card-content>
      <div class="radar-container">
        <svg viewBox="0 0 200 210" class="radar-chart"> <!-- Aumentamos un poco el alto del viewBox -->
  <!-- Líneas de los ejes -->
  <line x1="100" y1="100" x2="100" y2="40" stroke="#555" stroke-width="1" />
  <line x1="100" y1="100" x2="155" y2="70" stroke="#555" stroke-width="1" />
  <line x1="100" y1="100" x2="155" y2="130" stroke="#555" stroke-width="1" />
  <line x1="100" y1="100" x2="100" y2="160" stroke="#555" stroke-width="1" />
  <line x1="100" y1="100" x2="45" y2="130" stroke="#555" stroke-width="1" />
  <line x1="100" y1="100" x2="45" y2="70" stroke="#555" stroke-width="1" />

  <!-- Hexágono de fondo -->
  <polygon points="100,40 155,70 155,130 100,160 45,130 45,70" 
           fill="rgba(255,255,255,0.05)" stroke="#666" stroke-width="1"/>
  
  <!-- Polígono de DATOS -->
  <polygon [attr.points]="getRadarPoints()" 
           fill="rgba(76, 175, 80, 0.4)" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Etiquetas con saltos de línea -->
  <text x="100" y="30" text-anchor="middle" class="radar-label">Interpretar</text>
  
  <text x="160" y="70" text-anchor="start" class="radar-label">Vocabulario</text>
  
  <text x="160" y="130" text-anchor="start" class="radar-label">
    <tspan x="160" dy="0">Tipos de</tspan>
    <tspan x="160" dy="12">Texto</tspan>
  </text>
  
  <text x="100" y="175" text-anchor="middle" class="radar-label">Localizar</text>
  
  <text x="40" y="130" text-anchor="end" class="radar-label">
    <tspan x="40" dy="0">Lectura</tspan>
    <tspan x="40" dy="12">Crítica</tspan>
  </text>
  
  <text x="40" y="70" text-anchor="end" class="radar-label">Evaluar</text>
</svg>
      </div>
    </ion-card-content>
  </ion-card>

    <!-- Train Button -->
    <ion-button 
      expand="block" 
      class="btn-entrenar"
      (click)="startTraining()">
      Entrenar
    </ion-button>

    <!-- Coaching Card -->
    <ion-card class="coaching-card">
      <ion-card-content>
        <div class="coaching-content">
          <div class="avatar">
            <ion-icon name="person-circle"></ion-icon>
          </div>
          <div class="coaching-text">
            <p>Concentrémonos en esto</p>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
